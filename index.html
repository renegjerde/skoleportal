<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lærerverktøy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .portal-container { max-width: 440px; margin: 0 auto; padding: 1rem 0; text-align: center; display: flex; flex-direction: column; gap: 20px; }
        .app-grid { display: flex; flex-direction: column; gap: 16px; }
        .app-card { background: #ffffff; padding: 24px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 8px; border: 2px solid transparent; transition: transform 0.2s; text-align: left; }
        .app-card:active { transform: scale(0.98); }
        .app-title { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 10px;}
        .app-desc { font-size: 0.95rem; color: #666; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="portal-container">
        <div style="margin-bottom: 10px;">
            <h1 style="font-size: 28px; font-weight: 800; color: #2C1A1D; margin-bottom: 8px;">Verktøykasse</h1>
            <p style="color: #666; font-size: 15px;">Alt du trenger på ett sted.</p>
        </div>
        <div class="app-grid">
            <a href="kaffestatus/index.html" class="app-card">
                <div class="app-title"><span style="font-size: 24px;">☕</span> Kaffestatus</div>
                <div class="app-desc">Hold oversikt over kaffekokingen på pauserommet.</div>
            </a>
            <a href="inspeksjonsvakt/index.html" class="app-card">
                <div class="app-title"><span style="font-size: 24px;">👀</span> Inspeksjonsvakt</div>
                <div class="app-desc">Din personlige vaktplan og neste inspeksjon.</div>
            </a>
            <a href="pausepuls/index.html" class="app-card">
                <div class="app-title"><span style="font-size: 24px;">⚡</span> PausePuls</div>
                <div class="app-desc">Raske pauseaktiviteter for å gi klassen ny energi.</div>
            </a>
        </div>
    </div>
</body>
</html>
